services:
  postgres:
    image: postgres:17
    container_name: task03-postgres
    environment:
      POSTGRES_DB: task03db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d task03db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: 55-1588_container
    ports:
      - "1588:8080"
    environment:
      USER_NAME: Compose_Mark_Maged
      ID: Compose_55_1588
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/task03db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
